settings:
  enabled: true
  message: "Config enabled!"
  # Включён ли локальный чат (сообщения без "!" в начале).
  # Меняется командой /chatfix localchat <on|off>
  local-chat-enabled: true
  # Радиус (в блоках), в котором видно локальные сообщения.
  # Меняется командой /chatfix radius <значение>
  local-chat-radius: 15.0
  # Включён ли мировой чат ("!сообщение") — сообщения всем игрокам в мире отправителя.
  # Меняется командой /chatfix worldchat <on|off>
  world-chat-enabled: true
  # Радиус (в блоках) мирового чата. 0 — на весь мир.
  # Меняется командой /chatfix worldradius <значение>
  world-chat-radius: 0.0
  # Включён ли глобальный чат ("!!сообщение") — сообщения всем игрокам на сервере.
  # Меняется командой /chatfix globalchat <on|off>
  global-chat-enabled: true
  # Что делать, если игрок пишет в отключённый режим чата:
  #   true  — сообщить ему, что администратор отключил этот чат;
  #   false — молча отправить сообщение в локальный чат (вместе с "!" / "!!" в начале).
  # Меняется командой /chatfix feedback <on|off>
  feedback-enabled: true
  # Язык сообщений плагина: ru, en или auto (по локали игрока)
  language: auto