name: ChatFix
description: A plugin that changes how the chat works and allows operators to modify the prefix and suffix of individual players' messages.
version: '${version}'

main: net.dvmn2.chatFix.ChatFix
api-version: '1.21'
load: POSTWORLD

authors: [ DVMN2 ]

permissions:
  chatmanager.admin:
    description: Доступ к /chatfix (префиксы/постфиксы, радиус, вкл/выкл глобального чата)
    default: op
  chatmanager.seehidden:
    description: Доступ к просмотру скрытых {фрагментов} чата
    default: op
  chatmanager.item:
    description: Использование [item] в чате
    default: true
  chatmanager.inv:
    description: Использование [inv] в чате
    default: true